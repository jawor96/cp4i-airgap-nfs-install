# ==============================================================================
# Instancja IBM MQ QueueManager (zoptymalizowana dla NFS Storage)
# Licencjonowanie w ramach IBM App Connect Enterprise (ACE) / Supporting Program
# Zgodnie z: https://www.ibm.com/docs/en/ibm-mq/10.0.x?topic=examples-example-customizing-license-service-annotations
# ==============================================================================
apiVersion: mq.ibm.com/v1beta1
kind: QueueManager
metadata:
  name: qmgr-demo
  namespace: cp4i
spec:
  # Adnotacje dla IBM License Service (IBMLS) informujące, że instancja MQ
  # jest instalowana i rozliczana w ramach licencji IBM App Connect Enterprise (ACE)
  annotations:
    productMetric: FREE # Oznaczenie jako program wspierający (supporting program) nieliczony podwójnie w metrykach VPC
  license:
    accept: true
    license: L-VCNK-GTT2F3 # Klucz licencyjny dla CP4I 16.2.x / MQ 10.0.1
    metric: VirtualProcessorCore
    use: NonProduction # Lub Production w zależności od środowiska
  version: 10.0.1.0-r1

  # Uprawnienia bezpieczeństwa dla wolumenów NFS (grupa nobody 65534 rozwiązuje błąd AMQ7077E / kod 119)
  securityContext:
    initVolumeAsRoot: false
    readOnlyRootFilesystem: false
    supplementalGroups:
      - 65534

  # Certyfikaty TLS (Cert-Manager)
  pki:
    keys:
      - name: default
        secret:
          secretName: qmgr-demo-tls-secret
          items:
            - tls.key
            - tls.crt
    trust:
      - name: cp4ica
        secret:
          secretName: qmgr-demo-tls-secret
          items:
            - ca.crt

  queueManager:
    name: QMGRDEMO
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: '1'
        memory: 1Gi
    availability:
      type: SingleInstance # Lub MultiInstance
    storage:
      allowVolumeExpansion: false
      defaultClass: mq-nfs-v41 # Klasa StorageClass NFS w klastrze OCP
      persistedData:
        enabled: true
        size: 2Gi
        type: persistent-claim
      queueManager:
        size: 2Gi
        type: persistent-claim
      recoveryLogs:
        enabled: true
        size: 2Gi
        type: persistent-claim
      scratch:
        enabled: true
      tmp:
        enabled: true
    ini:
      - configMap:
          name: mq-demo-ini
          items:
            - mq-demo-resources.ini
    mqsc:
      - configMap:
          name: mq-demo-mqsc
          items:
            - mq-demo-resources.mqsc

  # Konsola Web zintegrowana z Keycloak SSO oraz Route
  web:
    console:
      authentication:
        provider: integration-keycloak
      authorization:
        provider: integration-keycloak
    enabled: true
    route:
      enabled: true
