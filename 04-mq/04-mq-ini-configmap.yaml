# ==============================================================================
# ConfigMap z konfiguracją qm.ini dla IBM MQ (wersja minimalna / bezpieczna)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mq-demo-ini
  namespace: cp4i
data:
  mq-demo-resources.ini: |
    Channels:
      MaxChannels=100
      MaxActiveChannels=100
      MQIBindType=FASTPATH
    TCP:
      KeepAlive=Yes
